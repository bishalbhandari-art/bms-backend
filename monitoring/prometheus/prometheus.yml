
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: books-service
    metrics_path: /metrics
    static_configs:
      - targets: ["books-service:3000"]

  - job_name: authors-service
    metrics_path: /metrics
    static_configs:
      - targets: ["authors-service:3000"]

  - job_name: categories-service
    metrics_path: /metrics
    static_configs:
      - targets: ["categories-service:3000"]

  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:3000"]

  - job_name: book-events-consumer
    metrics_path: /metrics
    static_configs:
      - targets: ["book-events-consumer:3000"]
